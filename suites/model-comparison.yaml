# Model comparison: PACMED pyesper 2015 (ESPER boundary BGC) against PACMED 2015 (WOA/
# GLODAP-climatology boundary BGC) -- the pair in Abigale's analysis_cache/pacmed_bc_compare.
# Forcing first (boundary, surface, initial conditions), then how the two solutions differ
# (domain means, metrics through time, maps), then each run against observations.
#
# Every block below is self-contained: comment out any section you don't need.
#
# Run it:
#     ocean-skill-run suites/model-comparison.yaml --list  # check the page list first
#     ocean-skill-run suites/model-comparison.yaml
# --list also runs the refresh: block below, so it rebuilds both runs' kerchunk
# references and every catalog entry the block names (it draws nothing).
#
# What differs between these two runs (from the task input folders): the boundary BGC
# (and, negligibly, the boundary physics files) and the restart each started from.
# Surface physics, surface BGC, salinity restoring, rivers and tides are the very same
# files (_forge_bp_runs/PACMED12km/input_data), so surface forcing gets one example page
# (salinity restoring vs WOA23) and the rest is left commented out. Rivers are not
# supported (indexed by nriver, not on the grid); tides have their own recipe in the
# README.
#
# Everything this suite reads is set up by the refresh: block, into one catalog
# (pacmed-pyesper-2015.yaml): the two runs' model output, the restart each run started
# from, and both runs' forcing files. The entries it writes:
#     pacmed_pyesper, pacmed_2015  model output (monthly restarts)
#     ic_pyesper, ic_pacmed2015    the restart each run started from
#     pyesper_bry_phys_<side>      boundary T/S/zeta, dated (2011-2013)
#     pyesper_bry_bgc_<side>       boundary ALK/DIC/NO3/O2/PO4/SiO3 from ESPER, dated
#     pacmed2015_bry_phys_<side>   boundary T/S/zeta, dated
#     pacmed2015_bry_bgc_<side>    boundary BGC climatology (month 1-12), all tracers
#     pyesper_surface_restoring_clim  the salinity restoring climatology (month 1-12)
# (more forcing entries -- boundary Chl/Fe/... climatology, surface physics, surface BGC,
# CO2 -- are commented out in refresh.forcing below)
# <side> is south, north, east or west. A side entry holds one row (south/north) or one
# column (east/west) of the grid, so its section is select: {transect: {eta_rho: 0}}
# for south/north and {transect: {xi_rho: 0}} for east/west. Boundary velocities are
# not catalogued (grid-relative, staggered).
#
# The forcing entries are rebuilt on every run, over kerchunk references (ref:) that are
# rebuilt only when their files change; the first run builds them all, which takes a
# while (the surface physics files are 37 GB each). An entry that cannot be built prints
# "refresh: FAILED <name>", and the pages reading it are skipped ("will be skipped" under
# --list); the rest of the report still draws.
#
# Known gaps (ocean-skill today):
#   - pacmed_2015's boundary BGC is a 12-month climatology, the pyesper one is dated. A
#     climatology cannot yet be drawn as a line over month or scored month-by-month
#     against a dated run in one page, so the BGC boundary comparison below is the mean
#     and the seasonal variability (std of the 12 monthly means), not a time series, and
#     the BGC boundary through time is drawn for the dated pyesper side only.
#
# Lines to edit for another pair: refresh: (both runs' output, start restarts, forcing
# files and grids), defaults.test, defaults.period, the forcing entry names in the
# pages, output_dir, cache_dir.

name: model-comparison
output_dir: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics
cache_dir: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics
pdf_images: jpeg
catalog_search_paths:
  - /anvil/projects/x-ees250129/cstar-forge-data/source-data/catalogs

# The gathered_output symlink folder hides the C-Star run folder from the cover page's
# own discovery, so name the test run's workplan and blueprint here.
run_info:
  workplan: /anvil/scratch/x-awyatt1/cstar/pacmed_pyesper_2015/PAC_2015-pyesper_transformed.yaml
  blueprint: /anvil/scratch/x-awyatt1/cstar/pacmed_pyesper_2015/tasks/m201101/work/B_PACMED12km_pyesper_2011.ovrd.cfrom.yaml
  notes:
    Comparison: "pacmed_pyesper_2015 (test, ESPER boundary BGC) vs pacmed_2015 (reference, WOA/GLODAP climatology boundary BGC)"

# Paths shared below (YAML anchors: &name defines, *name reuses).
#   pyesper forcing lives in one folder per year; each holds Dec of the year before
#   through Jan of the year after, so every glob keeps only that year's twelve months.
#   pacmed_2015's forcing, and every surface file of both runs, is the shared
#   _forge_bp_runs/PACMED12km/input_data folder.
refresh:
  catalog: /anvil/projects/x-ees250129/cstar-forge-data/source-data/catalogs/pacmed-pyesper-2015.yaml

  # -- model output and initial conditions (kerchunk references) ----------------------
  sources:
    - name: pacmed_pyesper
      files: /anvil/scratch/x-awyatt1/cstar/pacmed_pyesper_2015/gathered_output/output_rst.*.nc
      grid: /anvil/scratch/x-awyatt1/cstar/pacmed_pyesper_2015/tasks/m201101/input/input_datasets/PACMED12km_grid.nc
      ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/pacmed_pyesper.parquet
      keep: latest-per-file
      # Store 1-level, 74-row chunks (74 divides the 962 rows): a page matched to a depth
      # then reads one ~110 MB band of whole water columns at a time instead of every
      # level of the whole domain (1.4 GB per variable per restart).
      subchunk: {s_rho: 1, s_w: 1, eta_rho: 74}
    - name: pacmed_2015
      # month-end restarts only: [23][0-9] skips y2011_test's 2011-01-01 file
      files: /anvil/scratch/x-awyatt1/cstar/pacmed_2015/tasks/*/output/output_rst.??????[23][0-9]234500.nc
      grid: /anvil/scratch/x-awyatt1/cstar/pacmed_2015/tasks/y2014/input/input_datasets/PACMED12km_grid.nc
      ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/pacmed_2015.parquet
      keep: latest-per-file
      subchunk: {s_rho: 1, s_w: 1, eta_rho: 74}
    # The restart each run started from. Restart files hold two records; keep the last.
    - name: ic_pyesper
      files: /anvil/scratch/x-awyatt1/cstar/pacmed_pyesper/tasks/all_the_rest/output/output_rst.20101231234500.nc
      grid: &grid /anvil/scratch/x-awyatt1/cstar/_forge_bp_runs/PACMED12km/input_data/PACMED12km_grid.nc
      ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/ic_pyesper.parquet
      keep: latest-per-file
      subchunk: {s_rho: 1, s_w: 1, eta_rho: 74}
    - name: ic_pacmed2015
      files: /anvil/scratch/x-awyatt1/cstar/pacmed/tasks/all_the_rest/output/output_rst.20101031234500.nc
      grid: *grid
      ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/ic_pacmed2015.parquet
      keep: latest-per-file
      subchunk: {s_rho: 1, s_w: 1, eta_rho: 74}

  # -- forcing files -------------------------------------------------------------------
  # kind: boundary -> one entry per side, <name>_<side>; kind: surface -> one entry.
  # files: a glob or a list of globs, joined in the order given (= time order).
  # ref: a kerchunk reference kept over the files, rebuilt only when they change (the
  # first build scans every file once; after that each run opens it in seconds). Two
  # entries over the same files share one ref.
  # Comment out any you don't need, along with the pages that read them.
  forcing:
    # boundary, pyesper run
    - name: pyesper_bry_phys
      kind: boundary
      subchunk: {bry_time: 1}   # monthly files of 28-31 days: one step per chunk so they join
      ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/forcing_pyesper_bry_phys.parquet
      grid: *grid
      files:
        - /anvil/projects/x-ees250129/x-bsaenz/cstar-forge-run/pac_12km_esper_2011/input_data/pac_12km_esper_boundary-physics_2011??.nc
        - /anvil/projects/x-ees250129/x-bsaenz/cstar-forge-run/pac_12km_esper_2012/input_data/pac_12km_esper_2012_boundary-physics_2012??.nc
        - /anvil/projects/x-ees250129/x-bsaenz/cstar-forge-run/pac_12km_esper_woamerge_2013/input_data/pac_12km_esper_2013_boundary-physics_2013??.nc
    - name: pyesper_bry_bgc
      kind: boundary
      subchunk: {bry_time: 1}   # monthly files of 28-31 days: one step per chunk so they join
      ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/forcing_pyesper_bry_bgc.parquet
      grid: *grid
      variables: [ALK, DIC, NO3, O2, PO4, SiO3]
      files:
        - /anvil/projects/x-ees250129/x-bsaenz/cstar-forge-run/pac_12km_esper_2011/input_data/pac_12km_esper_boundary-bgc-esper-alk_dic_no3_o2_po4_sio3_2011??.nc
        - /anvil/projects/x-ees250129/x-bsaenz/cstar-forge-run/pac_12km_esper_2012/input_data/pac_12km_esper_2012_boundary-bgc-esper-alk_dic_no3_o2_po4_sio3_2012??.nc
        - /anvil/projects/x-ees250129/x-bsaenz/cstar-forge-run/pac_12km_esper_woamerge_2013/input_data/pac_12km_esper_2013_boundary-bgc-esper-alk_dic_no3_o2_po4_sio3_2013??.nc
    # - name: pyesper_bry_bgcclim
    #   kind: boundary
    #   ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/forcing_pyesper_bry_bgcclim.parquet
    #   grid: *grid
    #   climatology: true
    #   files: /anvil/projects/x-ees250129/x-bsaenz/cstar-forge-run/pac_12km_esper_2011/input_data/pac_12km_esper_boundary-bgc-unified-chl_doc_docr_don_donr_dop_dopr_fe_nh4_clim.nc

    # boundary, pacmed_2015 run
    - name: pacmed2015_bry_phys
      kind: boundary
      subchunk: {bry_time: 1}   # monthly files of 28-31 days: one step per chunk so they join
      ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/forcing_pacmed2015_bry_phys.parquet
      grid: *grid
      files: /anvil/scratch/x-awyatt1/cstar/_forge_bp_runs/PACMED12km/input_data/PACMED12km_boundary-physics_201[123]??.nc
    - name: pacmed2015_bry_bgc
      kind: boundary
      ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/forcing_pacmed2015_bry_bgc.parquet
      grid: *grid
      climatology: true
      files: /anvil/scratch/x-awyatt1/cstar/_forge_bp_runs/PACMED12km/input_data/PACMED12km_boundary-bgc-unified_clim.nc

    # surface: the very same files in both runs here, so only the pyesper salinity
    # restoring climatology is read (one example page). The rest are commented out as a
    # template for a pair whose surface forcing differs: uncomment, point each run's
    # entries at its own files AND give them their own ref: (the <<: copies inherit it;
    # a ref shared over different files is refused). Surface physics is hourly over the
    # whole domain, 37 GB a month, 1.3 TB for the run.
    # - name: pyesper_surface_phys
    #   kind: surface
    #   ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/forcing_surface_phys.parquet
    #   grid: *grid
    #   files: /anvil/scratch/x-awyatt1/cstar/_forge_bp_runs/PACMED12km/input_data/PACMED12km_surface-physics_201[123]??.nc
    # - &surface_bgc_clim
    #   name: pyesper_surface_bgc_clim
    #   kind: surface
    #   ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/forcing_surface_bgc_clim.parquet
    #   grid: *grid
    #   climatology: true
    #   files: /anvil/scratch/x-awyatt1/cstar/_forge_bp_runs/PACMED12km/input_data/PACMED12km_surface-bgc-unified_clim.nc
    # - <<: *surface_bgc_clim
    #   name: pacmed2015_surface_bgc_clim
    - &surface_restoring_clim
      name: pyesper_surface_restoring_clim
      kind: surface
      ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/forcing_surface_restoring_clim.parquet
      grid: *grid
      climatology: true
      files: /anvil/scratch/x-awyatt1/cstar/_forge_bp_runs/PACMED12km/input_data/PACMED12km_surface-restoring_clim.nc
    # - <<: *surface_restoring_clim
    #   name: pacmed2015_surface_restoring_clim
    # - &surface_co2
    #   name: pyesper_surface_co2
    #   kind: surface
    #   ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/forcing_surface_co2.parquet
    #   grid: *grid
    #   time_coord: xco2_time
    #   files: /anvil/scratch/x-awyatt1/cstar/_forge_bp_runs/PACMED12km/input_data/PACMED12km_surface-bgc-mbl_co2_201[123].nc
    # - <<: *surface_co2
    #   name: pacmed2015_surface_co2

defaults:
  test: pacmed_pyesper
  # The overlap of the two runs (pacmed_2015 runs on into 2014). Pages comparing the two
  # runs, and the forcing time series, use time: "{period}".
  period: {min: "2011-01-01", max: "2013-12-31"}
  depths: [surface, 200]
  # Depths of the boundary sections (m). The deepest the grid reaches will be NaN where
  # the boundary is shallower.
  bry_depths: [5, 10, 25, 50, 100, 150, 200, 300, 400, 500, 750, 1000]
  # Depth of the boundary line plots (m), the same 200 m as the rest of the suite. A list
  # of several draws one line pair per depth on each panel.
  bry_line_depths: [200]

pages:
  # =====================================================================================
  # 1. Boundary forcing through time (Abigale's line plots)
  # =====================================================================================
  - title: "Boundary forcing through time"
    section: >-
      Each open boundary's forcing averaged along the boundary at fixed depths (5 m to
      1000 m), as monthly means through the overlap. First depth against time in colour,
      one panel per boundary, for temperature and for ESPER nitrate (pyesper run). Then
      200 m as lines, pyesper against pacmed_2015, with the difference (pyesper
      minus pacmed_2015) in a strip below each panel. pacmed_2015's boundary BGC is a
      monthly climatology, which cannot yet be lined up month by month against a dated
      run, so the BGC difference is in the next section (mean and seasonal variability).

  # Depth against time, one panel per boundary. An explicit depth list normally draws
  # one line per depth; family: time_depth asks for the colour panel instead.
  - title: "Temperature along each boundary, depth vs time (pyesper run)"
    field:
      source: [pyesper_bry_phys_south, pyesper_bry_phys_north, pyesper_bry_phys_east, pyesper_bry_phys_west]
      variables: [temperature]
      select: {depth: "{bry_depths}", time: "{period}"}
      aggregate: {lon: mean, lat: mean, time: {resample: 1MS, reduce: mean}}
    plot: {family: time_depth}

  - title: "Nitrate along each boundary, depth vs time (ESPER, pyesper run)"
    field:
      source: [pyesper_bry_bgc_south, pyesper_bry_bgc_north, pyesper_bry_bgc_east, pyesper_bry_bgc_west]
      variables: [nitrate]
      select: {depth: "{bry_depths}", time: "{period}"}
      aggregate: {lon: mean, lat: mean, time: {resample: 1MS, reduce: mean}}
    plot: {family: time_depth}

  # One depth as lines, both runs, with the difference strip (Abigale's figure).
  - title: "Boundary temperature and salinity at 200 m, pyesper vs pacmed_2015 — {side}"
    for_each:
      side: [south, east, west]   # north is a ~75 m shelf: nothing at 200 m
    compare:
      test: "pyesper_bry_phys_{side}"
      reference: ["pacmed2015_bry_phys_{side}"]
      variables: [temperature, salinity]
      depths: "{bry_line_depths}"
      select: {time: "{period}"}
      aggregate: {lon: mean, lat: mean}
    plot: {residual: true}

  # =====================================================================================
  # 2. Boundary BGC: ESPER (pyesper) against the climatology (pacmed_2015)
  # =====================================================================================
  - title: "Boundary BGC, ESPER vs climatology"
    section: >-
      Sections along each open boundary, surface to 1000 m: the pyesper run's dated ESPER
      boundary BGC against pacmed_2015's monthly climatology. Top: the mean (ESPER over the
      overlap, the climatology over its 12 months). Bottom: the seasonal variability, the
      standard deviation (ddof 1) across the 12 monthly means.

  - title: "Boundary BGC, ESPER vs climatology — {side} (mean and seasonal variability)"
    for_each:
      side: [south, north]
    compare:
      test: "pyesper_bry_bgc_{side}"
      reference: ["pacmed2015_bry_bgc_{side}"]
      variables: [alkalinity, dissolved_inorganic_carbon, nitrate, oxygen, phosphate, silicate]
      select: {transect: {eta_rho: 0}, depth: "{bry_depths}"}   # ESPER files span exactly 2011-2013
      aggregate:
        - {test: {time: mean}, reference: {month: mean}}
        - {test: {time: [{groupby: month, reduce: mean}, {reduce: std, ddof: 1}]},
           reference: {month: {reduce: std, ddof: 1}}}

  - title: "Boundary BGC, ESPER vs climatology — {side} (mean and seasonal variability)"
    for_each:
      side: [east, west]
    compare:
      test: "pyesper_bry_bgc_{side}"
      reference: ["pacmed2015_bry_bgc_{side}"]
      variables: [alkalinity, dissolved_inorganic_carbon, nitrate, oxygen, phosphate, silicate]
      select: {transect: {xi_rho: 0}, depth: "{bry_depths}"}   # ESPER files span exactly 2011-2013
      aggregate:
        - {test: {time: mean}, reference: {month: mean}}
        - {test: {time: [{groupby: month, reduce: mean}, {reduce: std, ddof: 1}]},
           reference: {month: {reduce: std, ddof: 1}}}

  # =====================================================================================
  # 3. Surface forcing: one example (the same files in both runs for this pair)
  # =====================================================================================
  - title: "Surface forcing"
    section: >-
      Surface forcing is the same files in both runs for this pair, so run-against-run
      pages would show zero differences. One example instead: the salinity the model is
      restored toward, its 12-month mean against WOA23 surface salinity.

  # roms-tools names it sss with standard_name sea_water_salinity, so ask for salinity.
  - title: "Salinity restoring climatology vs WOA23 surface salinity (12-month mean)"
    compare:
      test: pyesper_surface_restoring_clim
      reference: [woa23_salinity_annual]
      variables: [salinity]
      select: {test: {}, reference: {depth: surface}}
      aggregate: {test: {month: mean}, reference: {}}

  # =====================================================================================
  # 4. Initial conditions: the restart each run started from
  # =====================================================================================
  - title: "Initial conditions"
    section: >-
      The restart each run started from: pyesper from pacmed_pyesper's 2010-12-31
      restart, pacmed_2015 from pacmed's 2010-10-31 restart (both descend from
      PACMED12km_initial_conditions.nc), at the surface and 200 m. The two dates differ by
      two months, so part of the difference is seasonal.

  - title: "Initial conditions, pyesper vs pacmed_2015 ({depth.label})"
    for_each:
      depth: "{depths}"
    compare:
      test: ic_pyesper
      reference: [ic_pacmed2015]
      variables: [temperature, salinity, nitrate, phosphate, silicate, oxygen,
                  alkalinity, dissolved_inorganic_carbon]
      depths: ["{depth}"]
      aggregate: {time: mean}

  # =====================================================================================
  # 5. The two solutions through time (Abigale's line plots)
  # =====================================================================================
  - title: "The two solutions through time"
    section: >-
      Area-weighted whole-domain means of the two runs' restart snapshots through the
      overlap: pyesper (test) and pacmed_2015 (reference) on one panel per variable, with
      the difference (pyesper minus pacmed_2015) in a strip below each and bias, RMSE and
      correlation printed on the panel. Then bias, RMSE and correlation of the two
      fields over the whole domain, month by month.

  - title: "Domain mean, pyesper vs pacmed_2015 ({depth.label})"
    for_each:
      depth: "{depths}"
    compare:
      reference: [pacmed_2015]
      variables: &comparison_variables
        - temperature
        - salinity
        - nitrate
        - alkalinity
        - oxygen
        - {sum: [spChl, diatChl, diazChl], standard_name: mass_concentration_of_chlorophyll_a_in_sea_water}
      select: {depth: "{depth}", time: "{period}"}
      aggregate: {lon: mean, lat: mean}
    plot: {residual: true}

  - title: "Domain mean sea surface height, pyesper vs pacmed_2015"
    compare:
      reference: [pacmed_2015]
      variables: [ssh]
      select: {time: "{period}"}
      aggregate: {lon: mean, lat: mean}
    plot: {residual: true}

  - title: "Bias, RMSE and correlation by month ({depth.label})"
    for_each:
      depth: "{depths}"
    compare:
      reference: [pacmed_2015]
      variables: *comparison_variables
      select: {depth: "{depth}", time: "{period}"}
      times: {resample: 1MS, reduce: mean}
    draw: metrics_series
    plot: {metrics: [bias, rmse, corr]}

  # =====================================================================================
  # 6. Difference maps (Abigale's _surf / _z200 maps)
  # =====================================================================================
  - title: "Difference maps"
    section: >-
      pyesper against pacmed_2015 at the surface and 200 m: averaged over the overlap,
      then the latest month the two share.

  - title: "Overlap mean, pyesper vs pacmed_2015 ({depth.label})"
    for_each:
      depth: "{depths}"
    compare:
      reference: [pacmed_2015]
      variables: *comparison_variables
      select: {depth: "{depth}", time: "{period}"}
      aggregate: {time: mean}
    plot: {robust: true}

  - title: "Overlap mean sea surface height, pyesper vs pacmed_2015"
    compare:
      reference: [pacmed_2015]
      variables: [ssh]
      select: {time: "{period}"}
      aggregate: {time: mean}
    plot: {robust: true}

  - title: "{month.name} {month.year}, pyesper vs pacmed_2015 ({depth.label})"
    for_each:
      month: {run: {last: 1}}   # raise N for more months
      depth: "{depths}"
    compare:
      reference: [pacmed_2015]
      variables: *comparison_variables
      select: {depth: "{depth}", time: "{month.window}"}
      aggregate: {time: mean}
    plot: {robust: true}

  # =====================================================================================
  # 7. Each run against observations
  # =====================================================================================
  - title: "Each run against observations"
    section: >-
      Each run's overlap mean and seasonal variability (standard deviation of the 12
      monthly means) against the WOA23 monthly climatology, at the surface and 200 m --
      which run sits closer to the observations.

  - title: "{run} vs WOA23 — mean and seasonal variability ({depth.label})"
    for_each:
      run: [pacmed_pyesper, pacmed_2015]
      depth: "{depths}"
    compare:
      test: "{run}"
      reference: [woa23_temperature_monthly, woa23_salinity_monthly, woa23_nitrate_monthly,
                  woa23_phosphate_monthly, woa23_silicate_monthly, woa23_oxygen_monthly]
      variables: [temperature, salinity, nitrate, phosphate, silicate, oxygen]
      depths: ["{depth}"]
      select: {test: {time: "{period}"}, reference: {}}
      aggregate:
        - {time: mean}
        - {time: [{groupby: month, reduce: mean}, {reduce: std, ddof: 1}]}

  - title: "Skill summary, every comparison above"
    summary: {kind: both, color_by: variable}
