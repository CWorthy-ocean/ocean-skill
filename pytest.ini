[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short
markers =
    unit: fast, isolated unit tests
    integration: end-to-end tests across modules
    slow: long-running tests (real data, regridding)
    network: requires network access (downloads, ERDDAP)
