[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Default run skips the slow (render-heavy) files for fast local iteration.
# Full suite: `pytest -m ""` (empty selector overrides the addopts filter).
# Slow-only:  `pytest -m slow`
addopts = --strict-markers --tb=short -n auto -m "not slow"
markers =
    unit: fast, isolated unit tests
    integration: end-to-end tests across modules
    slow: long-running tests (real data, regridding, heavy rendering)
    network: requires network access (downloads, ERDDAP)
    adaptive_coastline: uses cartopy's real extent-based coastline scale (opts out of conftest's coarse_auto_coastlines)
