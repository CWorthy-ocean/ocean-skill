metadata:
  description: 'Aqua MODIS L3 mapped chlorophyll-a (chlor_a, 4km): monthly climatologies
    (all 12 months) plus two example daily granules, read directly over OPeNDAP from
    NASA''s OB.DAAC. Filenames (and especially the climatology''s end-date) come from
    ocean_skill.build.discover_opendap_files rather than being hand-typed, since NASA
    periodically reprocesses and extends them.'
  featureTypes:
  - grid
  geospatial_lat_max: 89.97916412353516
  geospatial_lat_min: -89.97917175292969
  geospatial_lon_max: 179.9791717529297
  geospatial_lon_min: -179.9791717529297
  standard_names:
  - mass_concentration_of_chlorophyll_in_sea_water
  title: MODIS Aqua Chlorophyll
user_parameters: {}
