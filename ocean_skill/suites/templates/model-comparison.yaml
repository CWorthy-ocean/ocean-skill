# Model comparison: PACMED12km with pyesper BGC boundary conditions against the run with
# MLD-interpolated BGC boundary conditions, from 2010-01. Built on Abigale's notebook
# (PACMED_BC_compare.ipynb, sections A-E; E's distance-band and seasonality parts are
# left out). Differences are always pyesper minus MLD-interp.
#
#                    MLD-interp (reference)              pyesper (test)
#   model output     pacmed (2010-01..10) +              pacmed_pyesper (2010) +
#                    pacmed_2015 (2010-11..2014-12)      pacmed_pyesper_2015 (2011..)
#   initial cond.    PACMED12km_initial_conditions.nc    pac_12km_esper_initial_conditions.nc
#   BGC boundary     PACMED12km_boundary-bgc-unified     ESPER, daily (ALK DIC NO3 O2 PO4 SiO3)
#                    _clim.nc (monthly climatology)      + Ben's unified BGC climatology
#   physics boundary PACMED12km_boundary-physics_*       Ben's pac_12km_esper_*_boundary-physics
#
# The two runs differ by MORE than the BGC boundary method: the pyesper run also uses
# Ben's physics boundaries and BGC initial conditions, which were built on a different
# bathymetry (hmin 5 m vs 15 m; h differs by up to ~2200 m). Both runs use the same grid
# file, so the forcing is drawn here on that grid, as the model received it. Neither run
# saved history or average files: everything comes from restart files (instantaneous
# snapshots), daily through January 2010 and at the end of every month after that.
#
# Sections:
#   A  domain                       bathymetry
#   B  input differences            initial conditions; boundary forcing along the
#                                   west+south strip (Jan and Jul 2010) and through time
#   C  start of the run             end of January 2010, maps and boundary sections
#   D  seasonal differences         end of Jan/Apr/Jul/Oct, years x seasons, maps and
#                                   boundary sections (difference only)
#   E  how the runs diverge         per-cell skill maps over the whole run and the last
#                                   year; domain means; metrics table
#   E2 skill through time           per-year target/Taylor diagrams; monthly and
#                                   first-month daily bias/RMS/correlation
#   F  each run against WOA23
#
# Run it:
#     ocean-skill-run model-comparison.yaml --list    # check the page list first
#     ocean-skill-run model-comparison.yaml --smoke 2 --self-check
#       (--smoke keeps only the first and last N restarts of each run, so every page that
#       names a date in between -- the end of January, the seasons, the January/July
#       boundary means -- finds no data under it and is reported; use --smoke for the
#       first-pass check of the other pages, and --only to redraw the dated ones.)
#     ocean-skill-run model-comparison.yaml
# --list also runs the refresh: block, which builds every entry the pages read into
# one catalog (pacmed-pyesper-2015.yaml): both runs from 2010 (each joined from its
# task folders), their initial conditions, and both runs' boundary forcing with a
# west+south strip entry each.
#
# This file is the shipped `model-comparison` suite, the one copy `ocean-skill-suite new`
# starts from. Copied by hand it runs as the suite for the PACMED run it was written
# for; `ocean-skill-suite new` rewrites the block between the "setup" markers below for
# your run (names, paths, dates, forcing files) and keeps everything else as it is.
# By hand, edit that block: mainly refresh: (output and grid paths), defaults.test, the
# dates, output_dir, cache_dir and catalog_search_paths.

# >>> setup: written by ocean-skill-suite new
name: model-comparison
output_dir: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics
cache_dir: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics
pdf_images: jpeg
catalog_search_paths:
  - /anvil/projects/x-ees250129/cstar-forge-data/source-data/catalogs

# The gathered_output symlink folder hides the C-Star run folder from the cover page's
# own discovery, so name the test run's workplan and blueprint here.
run_info:
  workplan: /anvil/scratch/x-awyatt1/cstar/pacmed_pyesper_2015/PAC_2015-pyesper_transformed.yaml
  blueprint: /anvil/scratch/x-awyatt1/cstar/pacmed_pyesper_2015/tasks/m201101/work/B_PACMED12km_pyesper_2011.ovrd.cfrom.yaml
  notes:
    Comparison: "pyesper (test: ESPER BGC boundary, Ben's physics boundary and ICs) vs MLD-interp (reference: MLD-interpolated BGC boundary climatology), 2010-01 on"

refresh:
  catalog: /anvil/projects/x-ees250129/cstar-forge-data/source-data/catalogs/pacmed-pyesper-2015.yaml
  # -- model output: each run joined from its task folders -------------------------------
  # files: a list of globs, joined in time order. A time step written by two folders is
  # taken from the later glob (and, within one glob, the later path). The 2010 folders:
  # first_wk, second_wk, third_2wks (daily restarts through 2010-02-01), first_half,
  # all_the_rest (month ends).
  sources:
    - name: pyesper
      files:
        - /anvil/scratch/x-awyatt1/cstar/pacmed_pyesper/tasks/*/output/output_rst.2010*.nc
        - /anvil/scratch/x-awyatt1/cstar/pacmed_pyesper_2015/gathered_output/output_rst.*.nc
      grid: &grid /anvil/scratch/x-awyatt1/cstar/_forge_bp_runs/PACMED12km/input_data/PACMED12km_grid.nc
      ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/pyesper_from2010.parquet
      keep: latest-per-file
      # Store 1-level, 74-row chunks (74 divides the 962 rows): a page matched to a depth
      # then reads one ~110 MB band of whole water columns at a time.
      subchunk: {s_rho: 1, s_w: 1, eta_rho: 74}
    - name: mld_interp
      files:
        - /anvil/scratch/x-awyatt1/cstar/pacmed/tasks/*/output/output_rst.2010*.nc
        # month-end restarts only: [23][0-9] skips the test segments' 2011-01-01 file
        - /anvil/scratch/x-awyatt1/cstar/pacmed_2015/tasks/*/output/output_rst.??????[23][0-9]234500.nc
      grid: *grid
      ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/mld_interp_from2010.parquet
      keep: latest-per-file
      subchunk: {s_rho: 1, s_w: 1, eta_rho: 74}
  # -- forcing -------------------------------------------------------------------------
  forcing:
    # initial conditions (2010-01-01); Ben's file carries no hc attribute
    - name: pyesper_ic
      kind: initial_conditions
      files: /anvil/projects/x-ees250129/x-bsaenz/cstar-forge-run/pac_12km_esper_2010/input_data/pac_12km_esper_initial_conditions.nc
      grid: *grid
      hc: 250.0
    - name: mld_ic
      kind: initial_conditions
      files: /anvil/scratch/x-awyatt1/cstar/_forge_bp_runs/PACMED12km/input_data/PACMED12km_initial_conditions.nc
      grid: *grid
    # boundary forcing; strip: adds <name>_strip, the west boundary north->south then the
    # south boundary west->east (north and east are almost all land)
    - name: pyesper_bry_phys
      kind: boundary
      strip: [west, south]
      subchunk: {bry_time: 1}   # monthly files of 28-31 days: one step per chunk so they join
      ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/forcing_pyesper_bry_phys_from2010.parquet
      grid: *grid
      files:
        - /anvil/projects/x-ees250129/x-bsaenz/cstar-forge-run/pac_12km_esper_2010/input_data/pac_12km_esper_boundary-physics_2010??.nc
        - /anvil/projects/x-ees250129/x-bsaenz/cstar-forge-run/pac_12km_esper_2011/input_data/pac_12km_esper_boundary-physics_2011??.nc
        - /anvil/projects/x-ees250129/x-bsaenz/cstar-forge-run/pac_12km_esper_2012/input_data/pac_12km_esper_2012_boundary-physics_2012??.nc
        - /anvil/projects/x-ees250129/x-bsaenz/cstar-forge-run/pac_12km_esper_woamerge_2013/input_data/pac_12km_esper_2013_boundary-physics_2013??.nc
    - name: pyesper_bry_bgc
      kind: boundary
      strip: [west, south]
      subchunk: {bry_time: 1}
      ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/forcing_pyesper_bry_bgc_from2010.parquet
      grid: *grid
      variables: [ALK, DIC, NO3, O2, PO4, SiO3]
      files:
        - /anvil/projects/x-ees250129/x-bsaenz/cstar-forge-run/pac_12km_esper_2010/input_data/pac_12km_esper_boundary-bgc-esper-alk_dic_no3_o2_po4_sio3_2010??.nc
        - /anvil/projects/x-ees250129/x-bsaenz/cstar-forge-run/pac_12km_esper_2011/input_data/pac_12km_esper_boundary-bgc-esper-alk_dic_no3_o2_po4_sio3_2011??.nc
        - /anvil/projects/x-ees250129/x-bsaenz/cstar-forge-run/pac_12km_esper_2012/input_data/pac_12km_esper_2012_boundary-bgc-esper-alk_dic_no3_o2_po4_sio3_2012??.nc
        - /anvil/projects/x-ees250129/x-bsaenz/cstar-forge-run/pac_12km_esper_woamerge_2013/input_data/pac_12km_esper_2013_boundary-bgc-esper-alk_dic_no3_o2_po4_sio3_2013??.nc
    - name: mld_bry_phys
      kind: boundary
      strip: [west, south]
      subchunk: {bry_time: 1}
      ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/forcing_mld_bry_phys_from2010.parquet
      grid: *grid
      files: /anvil/scratch/x-awyatt1/cstar/_forge_bp_runs/PACMED12km/input_data/PACMED12km_boundary-physics_201[0123]??.nc
    - name: mld_bry_bgc
      kind: boundary
      strip: [west, south]
      ref: /anvil/projects/x-ees250129/x-kthyng/pacmed_pyesper_2015/diagnostics/refs/forcing_pacmed2015_bry_bgc.parquet
      grid: *grid
      climatology: true
      files: /anvil/scratch/x-awyatt1/cstar/_forge_bp_runs/PACMED12km/input_data/PACMED12km_boundary-bgc-unified_clim.nc

defaults:
  test: pyesper
  reference: mld_interp
  # How the pages name the two runs, so another pair changes only these lines:
  #   {test}, {reference}                 the source names (above)
  #   {test_label}, {reference_label}     the runs in titles, captions and section text
  #   {test_forcing}, {reference_forcing} prefix of each run's forcing entries
  #                                       (<prefix>_ic, <prefix>_bry_phys, ...)
  #   runs                                both sources, for the section F loop
  test_label: pyesper
  reference_label: MLD-interp
  test_forcing: pyesper
  reference_forcing: mld
  runs: [pyesper, mld_interp]
  # Both runs from their initial conditions to the end of the pyesper run.
  period: {min: "2010-01-01", max: "2013-12-31"}
  last_year: {min: "2013-01-01", max: "2013-12-31"}
  first_month: {min: "2010-01-01", max: "2010-02-01T12:00"}
  end_of_jan: "2010-01-31"
  # End of Jan / Apr / Jul / Oct, 2010-2013: the years x seasons grids (4 columns).
  season_days: ["2010-01-31", "2010-04-30", "2010-07-31", "2010-10-31",
                "2011-01-31", "2011-04-30", "2011-07-31", "2011-10-31",
                "2012-01-31", "2012-04-30", "2012-07-31", "2012-10-31",
                "2013-01-31", "2013-04-30", "2013-07-31", "2013-10-31"]
# <<< setup
  # (the rest of defaults: is the same for every run)
  # Every page's plot: options start from these (a page's own plot: wins).
  plot: {robust: true}
  depths: [surface, 200]
  # Abigale's six variables, at most three per figure.
  groups:
    - name: temperature, salinity, chlorophyll
      vars: [temperature, salinity,
             {sum: [spChl, diatChl, diazChl], standard_name: mass_concentration_of_chlorophyll_a_in_sea_water}]
    - name: nitrate, alkalinity, oxygen
      vars: [nitrate, alkalinity, oxygen]
  all_vars: [temperature, salinity, nitrate, alkalinity, oxygen,
             {sum: [spChl, diatChl, diazChl], standard_name: mass_concentration_of_chlorophyll_a_in_sea_water}]
  # The same six, one page each: a title needs a name for the summed chlorophyll.
  var_pages:
    - {name: temperature, vars: [temperature]}
    - {name: salinity, vars: [salinity]}
    - {name: nitrate, vars: [nitrate]}
    - {name: alkalinity, vars: [alkalinity]}
    - {name: oxygen, vars: [oxygen]}
    - name: chlorophyll
      vars: [{sum: [spChl, diatChl, diazChl], standard_name: mass_concentration_of_chlorophyll_a_in_sea_water}]
  # The boundary forcing, by file: physics (T, S) and BGC (ESPER vs the climatology).
  strip_groups:
    - name: temperature and salinity
      src: phys
      vars: [temperature, salinity]
      # the strip is the west+south boundary, not the domain: panel titles say so
      titles: ["temperature · along-boundary mean, 0–500 m",
               "salinity · along-boundary mean, 0–500 m"]
    - name: "nitrate, alkalinity and oxygen"
      src: bgc
      vars: [nitrate, alkalinity, oxygen]
      titles: ["nitrate · along-boundary mean, 0–500 m",
               "alkalinity · along-boundary mean, 0–500 m",
               "oxygen · along-boundary mean, 0–500 m"]
  # The boundary sections: upper 1000 m.
  strip_depths: [5, 10, 25, 50, 100, 150, 200, 300, 400, 500, 750, 1000]

pages:
  # == A. Domain ==========================================================================
  - title: "A. Domain"
    section: >-
      The PACMED12km domain. The south and west boundaries are open ocean (99% and 70%
      wet); the north and east are almost all land. The boundary sections below run along
      the west boundary from north to south, then along the south boundary from west to
      east; the dotted vertical line marks the south-west corner.

  - title: "Bathymetry"
    field: {source: "{reference}", variables: [h]}
    caption: Grid depth h (m), the grid file both runs use.
    plot: {robust: false}

  # == B. Input differences ================================================================
  - title: "B. Input differences"
    section: >-
      What each run was given. The initial conditions (2010-01-01) at the surface and at
      200 m, then the boundary forcing along the west+south strip: monthly means for
      January and July 2010, and the upper-500 m strip mean through time. Temperature and
      salinity come from the physics boundary files; nitrate, alkalinity and oxygen from
      the ESPER files ({test_label}) and the MLD-interpolated climatology ({reference_label}, its
      calendar month).

  - title: "Initial conditions — {group.name} ({depth.label})"
    for_each:
      group: "{groups}"
      depth: "{depths}"
    compare:
      test: "{test_forcing}_ic"
      reference: ["{reference_forcing}_ic"]
      variables: "{group.vars}"
      depths: ["{depth}"]
    caption: >-
      2010-01-01 initial conditions at {depth.label}: {test_label}, {reference_label}, and {test_label}
      minus {reference_label}.

  - title: "Boundary forcing along the strip — {variable} (January and July 2010)"
    for_each:
      variable: [temperature, salinity]
    compare:
      test: "{test_forcing}_bry_phys_strip"
      reference: ["{reference_forcing}_bry_phys_strip"]
      variables: ["{variable}"]
      select: {transect: {eta_rho: 0}, depth: "{strip_depths}"}
      times: ["2010-01", "2010-07"]
      aggregate: {time: mean}
    caption: >-
      Monthly-mean boundary forcing along the west boundary (north to south) then the
      south boundary (west to east), upper 1000 m. Rows: January and July 2010.

  - title: "Boundary forcing along the strip — {variable} (January and July 2010)"
    for_each:
      variable: [nitrate, alkalinity, oxygen]
    compare:
      test: "{test_forcing}_bry_bgc_strip"
      reference: ["{reference_forcing}_bry_bgc_strip"]
      variables: ["{variable}"]
      select: {transect: {eta_rho: 0}, depth: "{strip_depths}"}
      times: ["2010-01", "2010-07"]
      aggregate: {time: mean}
    caption: >-
      ESPER ({test_label}, monthly mean of the daily files) against the MLD-interpolated
      climatology for the same calendar month ({reference_label}), upper 1000 m along the strip.

  - title: "Boundary forcing through time — upper 500 m strip mean ({group.name})"
    for_each:
      group: "{strip_groups}"
    compare:
      test: "{test_forcing}_bry_{group.src}_strip"
      reference: ["{reference_forcing}_bry_{group.src}_strip"]
      variables: "{group.vars}"
      select: {depth: {min: 0, max: 500}, time: "{period}"}
      aggregate: {Z: mean, lon: mean, lat: mean, time: {resample: 1MS, reduce: mean}}
    plot: {residual: true, titles: "{group.titles}"}
    caption: >-
      Thickness- and length-weighted mean over the upper 500 m of the west+south strip,
      monthly; the strip below each panel is {test_label} minus {reference_label}.

  - title: "B. Input differences — metrics"
    summary: {scope: section, kind: [table]}

  # == C. Start of the run =================================================================
  - title: "C. Start of the run"
    section: >-
      The end of January 2010 (the daily restart of 2010-01-31), one month after both
      runs started: maps at the surface and 200 m, then the boundary sections of the
      initial conditions and of the end of January.

  - title: "End of January 2010 — {group.name} ({depth.label})"
    for_each:
      group: "{groups}"
      depth: "{depths}"
    compare:
      reference: ["{reference}"]
      variables: "{group.vars}"
      depths: ["{depth}"]
      select: {time: "{end_of_jan}"}
      aggregate: {time: mean}
    caption: >-
      The 2010-01-31 restart at {depth.label}: {test_label}, {reference_label}, and the difference.

  - title: "Initial conditions along the boundary — {group.name}"
    for_each:
      group: "{groups}"
    compare:
      test: "{test_forcing}_ic"
      reference: ["{reference_forcing}_ic"]
      variables: "{group.vars}"
      select: {transect: {boundary: [west, south]}, depth: "{strip_depths}"}
    caption: >-
      2010-01-01 initial conditions along the west boundary (north to south) then the
      south boundary (west to east), upper 1000 m; dotted line: the south-west corner.

  - title: "End of January 2010 along the boundary — {group.name}"
    for_each:
      group: "{groups}"
    compare:
      reference: ["{reference}"]
      variables: "{group.vars}"
      select: {transect: {boundary: [west, south]}, depth: "{strip_depths}", time: "{end_of_jan}"}
      aggregate: {time: mean}
    caption: >-
      The 2010-01-31 restart along the west+south boundary strip, upper 1000 m.

  - title: "C. Start of the run — metrics"
    summary: {scope: section, kind: [table, target], title: "C. Start of the run — metrics", color_by: variable, legend_style: legend}

  # == D. Seasonal differences ==============================================================
  - title: "D. Seasonal differences"
    section: >-
      {test_label} minus {reference_label} at the end of January, April, July and October of each
      year (rows: 2010-2013), difference only on one colour scale per figure: maps at
      the surface and 200 m, then the west+south boundary sections.

  - title: "Seasonal difference maps — {variable.name} ({depth.label})"
    for_each:
      variable: "{var_pages}"
      depth: "{depths}"
    compare:
      reference: ["{reference}"]
      variables: "{variable.vars}"
      depths: ["{depth}"]
      times: "{season_days}"
      aggregate: {time: mean}
    plot: {panels: difference, ncols: 4}

  - title: "Seasonal difference sections along the boundary — {variable.name}"
    for_each:
      variable: "{var_pages}"
    compare:
      reference: ["{reference}"]
      variables: "{variable.vars}"
      select: {transect: {boundary: [west, south]}, depth: "{strip_depths}"}
      times: "{season_days}"
      aggregate: {time: mean}
    plot: {panels: difference, ncols: 4}

  # == E. How the runs diverge ==============================================================
  - title: "E. How the runs diverge"
    section: >-
      Skill of {test_label} against {reference_label} at every grid cell over the time series of
      restarts (bias, centered RMS difference, correlation, standard-deviation ratio),
      over the whole run and over its last year, and the whole-domain mean of every
      restart. The next section follows how the skill changes from year to year, month
      to month and day to day.

  - title: "Per-cell skill over the run — {variable.name}"
    for_each:
      variable: "{var_pages}"
    compare:
      reference: ["{reference}"]
      variables: "{variable.vars}"
      depths: "{depths}"
      select: {time: "{period}"}
      over: time
    caption: >-
      {variable.name}: at each grid cell, {test_label} scored against {reference_label} over every
      restart from 2010-01 to 2013-12. Rows: surface and 200 m.

  - title: "Per-cell skill over the last year — {variable.name}"
    for_each:
      variable: "{var_pages}"
    compare:
      reference: ["{reference}"]
      variables: "{variable.vars}"
      depths: "{depths}"
      select: {time: "{last_year}"}
      over: time
    caption: >-
      {variable.name}: as above, over 2013 only, where the runs have diverged by the end.

  - title: "Domain means ({depth.label})"
    for_each:
      depth: "{depths}"
    compare:
      reference: ["{reference}"]
      variables: "{all_vars}"
      depths: ["{depth}"]
      select: {time: "{period}"}
      aggregate: {lon: mean, lat: mean}
    plot: {residual: true}
    caption: >-
      {depth.label}: area-weighted whole-domain means of every restart; the strip below
      each panel is {test_label} minus {reference_label}.

  - title: "E. How the runs diverge — metrics"
    summary: {scope: section, kind: [table]}

  # == E2. Skill through time ===============================================================
  # Its own section so the metrics table above stays the per-cell and domain-mean rows:
  # these pages carry hundreds of comparisons (a point per variable and year, month and
  # day), which belong in the figures and in metrics/model-comparison.csv, not in a table.
  - title: "E2. Skill through time"
    section: >-
      Each year's skill pooled over every cell and restart, as a target and a Taylor
      diagram with an arrow from year to year; then the bias, RMS difference and
      correlation month by month, and the RMS difference at each daily restart of the
      first month.

  - title: "Skill by year — target ({depth.label})"
    for_each:
      depth: "{depths}"
    compare:
      reference: ["{reference}"]
      variables: "{all_vars}"
      depths: ["{depth}"]
      select: {time: "{period}"}
      times: {resample: 1YS, reduce: pool}
    draw: target
    plot:
      title: "Skill by year, target ({depth.label})"
      arrows: true
      color_by: variable
      legend_style: legend
    caption: >-
      {depth.label}: one point per variable and year (every cell of every restart in the
      year pooled); arrows run from 2010 (hollow) to 2013.

  - title: "Skill by year — Taylor ({depth.label})"
    for_each:
      depth: "{depths}"
    compare:
      reference: ["{reference}"]
      variables: "{all_vars}"
      depths: ["{depth}"]
      select: {time: "{period}"}
      times: {resample: 1YS, reduce: pool}
    draw: taylor
    plot:
      title: "Skill by year, Taylor ({depth.label})"
      arrows: true
      color_by: variable
      legend_style: legend
    caption: >-
      {depth.label}: the same points as the target diagram; arrows run from 2010 (hollow)
      to 2013.

  - title: "Bias, RMS difference and correlation by month ({depth.label})"
    for_each:
      depth: "{depths}"
    compare:
      reference: ["{reference}"]
      variables: "{all_vars}"
      depths: ["{depth}"]
      select: {time: "{period}"}
      times: {resample: 1MS, reduce: pool}
    draw: metrics_series
    plot: {metrics: [bias, rmse, corr]}
    caption: >-
      {depth.label}: each month's restarts pooled over the whole domain (January 2010
      holds the daily restarts).

  - title: "First month: daily RMS difference ({depth.label})"
    for_each:
      depth: "{depths}"
    compare:
      reference: ["{reference}"]
      variables: "{all_vars}"
      depths: ["{depth}"]
      select: {time: "{first_month}"}
      times: {resample: 1D, reduce: pool}
    draw: metrics_series
    plot: {metrics: [rmse]}
    caption: >-
      {depth.label}: whole-domain RMS difference at each daily restart of January 2010.

  # == F. Each run against observations =====================================================
  - title: "F. Each run against WOA23"
    section: >-
      Each run's mean over 2011-2013 and its seasonal variability (standard deviation,
      ddof 1, across the twelve monthly means) against the WOA23 monthly climatology, at
      the surface and 200 m: which run sits closer to the observations.

  - title: "{run} vs WOA23 — mean and seasonal variability ({depth.label})"
    for_each:
      run: "{runs}"
      depth: "{depths}"
    compare:
      test: "{run}"
      reference: [woa23_temperature_monthly, woa23_salinity_monthly, woa23_nitrate_monthly,
                  woa23_phosphate_monthly, woa23_silicate_monthly, woa23_oxygen_monthly]
      variables: [temperature, salinity, nitrate, phosphate, silicate, oxygen]
      depths: ["{depth}"]
      select: {test: {time: {min: "2011-01-01", max: "2013-12-31"}}, reference: {}}
      aggregate:
        - {time: mean}
        - {time: [{groupby: month, reduce: mean}, {reduce: std, ddof: 1}]}

  - title: "F. Each run against WOA23 — metrics"
    summary: {scope: section, kind: [table, target], title: "F. Each run against WOA23 — metrics", color_by: variable, legend_style: legend}
